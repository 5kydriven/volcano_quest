name: volcano_quest
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  shared_preferences: ^2.5.5
  flutter_3d_controller: ^2.3.0
  drift: ^2.33.0
  rive: ^0.14.6
  flame: ^1.37.0
  lottie: ^3.3.3
  flutter_animate: ^4.5.2
  just_audio: ^0.10.5
  confetti: ^0.8.0
  video_player: ^2.10.1
  cloud_firestore: ^6.5.0
  firebase_core: ^4.10.0
  connectivity_plus: ^7.1.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.4.0
  drift_dev: ^2.33.0
  build_runner: ^2.15.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/avatars/
    - assets/videos/
    - assets/models/
    - assets/animated_avatars/
    - assets/splash_screen/