name: volcano_quest
description: 'A new Flutter project.'
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  shared_preferences: ^2.5.5
  flutter_3d_controller: ^2.3.0
  drift: ^2.33.0
  rive: ^0.14.6
  flame: ^1.37.0
  lottie: ^3.3.3
  flutter_animate: ^4.5.2
  just_audio: ^0.10.5
  confetti: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/avatars/Analyst_boy.png
    - assets/avatars/Analyst_girl.png
    - assets/avatars/Chemist_boy.jpeg
    - assets/avatars/Chemist_girl.jpeg
    - assets/avatars/Explorer_boy.png
    - assets/avatars/Explorer_girl.png
    - assets/avatars/Geologist_boy.jpeg
    - assets/avatars/Geologist_girl.jpeg
    - assets/avatars/Observer_boy.jpeg
    - assets/avatars/Observer_girl.jpeg
    - assets/avatars/Researcher_boy.jpeg
    - assets/avatars/Researcher_girl.png
    - assets/avatars/Scientist_boy.jpeg
    - assets/avatars/Scientist_girl.jpeg
    - assets/avatars/Strategist_boy.jpeg
    - assets/avatars/Strategist_girl.jpeg
    - assets/videos/
    - assets/models/
